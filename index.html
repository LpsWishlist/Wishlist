<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de Little Pet Shop - Colecciona tus mascotas favoritas">
    <meta name="keywords" content="Little Pet Shop, LPS, colecciones, tienda online">
    <meta name="theme-color" content="#F5D5E3">
    <title>Little Pet Shop - Catálogo de Mascotas y Accesorios</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="title">WISHLIST</h1>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav">
        <button class="nav-button nav-button--active" data-section="lps">LPS</button>
        <button class="nav-button" data-section="accesorios">ACCESORIOS</button>
        <button class="nav-button" data-section="otros">OTROS</button>
        <button class="nav-button" data-section="permuta">SE PERMUTA</button>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="section-header">
            <h2 class="section-title" id="section-title">LPS</h2>
        </div>

        <!-- Products Grid -->
        <div class="grid" id="products-grid">
            <!-- Los productos se cargan con JavaScript -->
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close" aria-label="Cerrar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="modal-content">
                <img id="modal-image" alt="Imagen del producto">
                <h3 class="modal-product-name" id="modal-product-name">Nombre del Producto</h3>

                <div class="question-container">
                    <p class="question" id="modal-question">¿Lo tienes?</p>
                </div>

                <div class="button-container">
                    <button class="button button--yes" id="btn-yes">SÍ</button>
                    <button class="button button--no" id="btn-no">NO</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
    </footer>

    <script src="script.js"></script>
</body>
</html>
