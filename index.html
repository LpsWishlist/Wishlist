<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de Little Pet Shop - Colecciona tus mascotas favoritas">
    <meta name="keywords" content="Little Pet Shop, LPS, colecciones, tienda online">
    <meta name="theme-color" content="#F5D5E3">
    <title>Little Pet Shop - Catálogo de Mascotas y Accesorios</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1 class="title">WISHLIST</h1>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav">
        <button class="nav-button nav-button--active" data-section="lps">LPS</button>
        <button class="nav-button" data-section="accesorios">ACCESORIOS</button>
        <button class="nav-button" data-section="otros">OTROS</button>
        <button class="nav-button" data-section="permuta">SE PERMUTA</button>
        <button class="nav-button" data-section="fotos">FOTOS</button>
    </nav>

    <!-- Main Content -->
    <main class="main">
        <div class="section-header">
            <h2 class="section-title section-title--shine" id="section-title">LPS</h2>
        </div>

        <!-- Products Grid -->
        <div class="grid" id="products-grid">
            <!-- Los productos se cargan con JavaScript -->
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close" aria-label="Cerrar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="modal-content">
               <img id="modal-image" alt="Imagen del producto">
                <h3 class="modal-product-name" id="modal-product-name">Nombre del Producto</h3>

                <div class="question-container">
                    <p class="question" id="modal-question">¿Lo tienes?</p>
                </div>

                <div class="button-container">
                    <button class="button button--yes" id="btn-yes">SÍ</button>
                    <button class="button button--no" id="btn-no">NO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay de animación "cara triste" al presionar NO (LPS, ACCESORIOS, OTROS, SE PERMUTA) -->
    <div class="sad-face-overlay" id="sad-face-overlay" aria-hidden="true">
        <img src="image/triste-1" alt="" class="sad-face-image" id="sad-face-image" onerror="this.style.display='none'">
    </div>

    <!-- Modal de Fotos: se abre al hacer clic en cualquier foto de la sección FOTOS -->
    <div class="photo-modal-overlay" id="photo-modal-overlay">
        <div class="photo-modal" id="photo-modal" tabindex="-1">
            <button class="modal-close" id="photo-modal-close" aria-label="Cerrar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="photo-modal-content">
                <div class="photo-zoom-container">
                    <img class="photo-zoom-image" id="photo-zoom-image" src="" alt="">
                </div>

                <div class="photo-controls">
                    <button class="photo-zoom-btn" id="photo-zoom-out" aria-label="Alejar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                    <button class="photo-zoom-btn" id="photo-zoom-reset" aria-label="Restablecer zoom">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                            <polyline points="3 4 3 9 8 9"></polyline>
                        </svg>
                    </button>
                    <button class="photo-zoom-btn" id="photo-zoom-in" aria-label="Acercar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Aviso flotante: aparece a los 8s indicando que las imágenes son clickeables -->
    <div class="floating-tip" id="floating-tip">
        <p class="floating-tip-text">Puedes hacer clic en las imágenes sin problema.</p>
        <button class="floating-tip-close" id="floating-tip-close" aria-label="Cerrar aviso">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <footer class="footer"></footer>

    <script src="script.js"></script>
</body>
</html>
